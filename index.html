  <body>
    <main>
      <header class="branding">
        <h2>How Nigerian Are You?</h2>
        <h1>Ethnicity Calculator</h1>
      </header>

      <div class="section-container">
        <!-- left hand side 70% -->
        <section class="left-section">
          <div id="calculator">
            <form id="ethnicityForm">
              <div class="parent" id="mother">
                <h2>Mother</h2>
                <div class="tribe-entry">
                  <div class="input-group">
                    <input
                      type="text"
                      placeholder="Tribe 1"
                      name="mother_tribe1"
                    />
                    <div class="error-message"></div>
                  </div>
                  <div class="input-group">
                    <input
                      type="number"
                      placeholder="Percent"
                      name="mother_percent1"
                    />
                    <div class="error-message"></div>
                  </div>
                </div>
                <div class="tribe-entry">
                  <div class="input-group">
                    <input
                      type="text"
                      placeholder="Tribe 2 (optional)"
                      name="mother_tribe2"
                    />
                    <div class="error-message"></div>
                  </div>
                  <div class="input-group">
                    <input
                      type="number"
                      placeholder="Percent (optional)"
                      name="mother_percent2"
                    />
                    <div class="error-message"></div>
                  </div>
                </div>
                <button type="button" class="btn-add">
                  Add Another Mother Tribe/Ethnicity
                </button>
              </div>

              <div class="parent" id="father">
                <h2>Father</h2>
                <div class="tribe-entry">
                  <div class="input-group">
                    <input
                      type="text"
                      placeholder="Tribe 1"
                      name="father_tribe1"
                    />
                    <div class="error-message"></div>
                  </div>
                  <div class="input-group">
                    <input
                      type="number"
                      placeholder="Percent"
                      name="father_percent1"
                    />
                    <div class="error-message"></div>
                  </div>
                </div>
                <div class="tribe-entry">
                  <div class="input-group">
                    <input
                      type="text"
                      placeholder="Tribe 2 (optional)"
                      name="father_tribe2"
                    />
                    <div class="error-message"></div>
                  </div>
                  <div class="input-group">
                    <input
                      type="number"
                      placeholder="Percent (optional)"
                      name="father_percent2"
                    />
                    <div class="error-message"></div>
                  </div>
                </div>
                <button type="button" class="btn-add">
                  Add Another Father Tribe/Ethnicity
                </button>
              </div>

              <button type="submit" id="calculate">Calculate</button>
            </form>

            <div id="result">
              <h2>Me</h2>
              <!-- The result will be displayed here -->
            </div>
          </div>
        </section>

        <section class="right-section">
