name: Puppeteer

on: push

jobs:
  puppeteer:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        npm install puppeteer

    - name: Run Puppeteer test
      run: |
        node test.js
