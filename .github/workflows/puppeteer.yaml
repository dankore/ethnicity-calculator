name: Puppeteer Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  puppeteer:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxshmfence-dev libgbm-dev libatk-bridge2.0-0 libgtk-3-0

    - name: Install Puppeteer globally
      run: |
        npm install -g puppeteer
        echo "NODE_PATH=$(npm root -g)" >> $GITHUB_ENV

    - name: Install http-server
      run: npm install -g http-server

    - name: Start HTTP Server
      run: http-server . -p 8080 & sleep 5  # Adjust as needed

    - name: Run Puppeteer test
      run: |
        node test.js
      shell: /usr/bin/bash -e {0}
