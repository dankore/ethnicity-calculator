name: JS Executable Check

on: push

jobs:
  check-js-executable:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Check if JavaScript is executable
      run: |
        echo "console.log('JS execution check');" > check.js
        cat scripts.js >> check.js
        node check.js
